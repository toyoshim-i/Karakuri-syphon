[package]
name = "karakuri-syphon"
version = "0.1.0"
edition = "2021"
rust-version = "1.84"
license = "MIT"
description = "A Syphon output sink plugin that speaks Karakuri's output-plugin protocol"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 2
